analyses:
  ultraviolet_optics:
    type: gridded_analysis
    source: ultraviolet_band_files
    groupby: all
    roles: &shortwave_roles
      column_extinction: column_extinction_source
      layer_extinction: layer_extinction_source
      layer_scattering: layer_scattering_source
      layer_asymmetry: layer_asymmetry_source
    fields: &shortwave_fields
      column_aod:
        formula: 'mean(column_extinction, dim="time")'
        units: "1"
        long_name: Monthly mean band column aerosol optical depth
        display_name: Column Aerosol Optical Depth
        style_preset: geosit_aod
      single_scatter_albedo:
        formula: 'sum(mean(layer_scattering, dim="time"), dim="z") / sum(mean(layer_extinction, dim="time"), dim="z")'
        units: "1"
        long_name: Monthly mean band single-scatter albedo
        display_name: Single-Scatter Albedo
      asymmetry:
        formula: 'sum(mean(layer_asymmetry * layer_scattering, dim="time"), dim="z") / sum(mean(layer_scattering, dim="time"), dim="z")'
        units: "1"
        long_name: Monthly mean band asymmetry parameter
        display_name: Asymmetry Parameter
    output_group: era5_modis_aod_nudging_band_optics
  visible_optics:
    type: gridded_analysis
    source: visible_band_files
    groupby: all
    roles: *shortwave_roles
    fields: *shortwave_fields
    output_group: era5_modis_aod_nudging_band_optics
  near_infrared_optics:
    type: gridded_analysis
    source: near_infrared_band_files
    groupby: all
    roles: *shortwave_roles
    fields: *shortwave_fields
    output_group: era5_modis_aod_nudging_band_optics
  shortwave_infrared_optics:
    type: gridded_analysis
    source: shortwave_infrared_band_files
    groupby: all
    roles: *shortwave_roles
    fields: *shortwave_fields
    output_group: era5_modis_aod_nudging_band_optics
  water_vapor_optics:
    type: gridded_analysis
    source: water_vapor_band_files
    groupby: all
    roles: &longwave_roles
      column_extinction: column_extinction_source
      layer_scattering: layer_scattering_source
      layer_asymmetry: layer_asymmetry_source
    fields: &longwave_fields
      column_scattering:
        formula: 'sum(mean(layer_scattering, dim="time"), dim="z")'
        units: "1"
        long_name: Monthly mean band column scattering optical depth
        display_name: Column Scattering Optical Depth
      column_extinction:
        formula: 'mean(column_extinction, dim="time")'
        units: "1"
        long_name: Monthly mean band column extinction optical depth
        display_name: Column Extinction Optical Depth
        style_preset: geosit_aod
      asymmetry:
        formula: 'sum(mean(layer_asymmetry * layer_scattering, dim="time"), dim="z") / sum(mean(layer_scattering, dim="time"), dim="z")'
        units: "1"
        long_name: Monthly mean band asymmetry parameter
        display_name: Asymmetry Parameter
    output_group: era5_modis_aod_nudging_band_optics
  ozone_optics:
    type: gridded_analysis
    source: ozone_band_files
    groupby: all
    roles: *longwave_roles
    fields: *longwave_fields
    output_group: era5_modis_aod_nudging_band_optics
  atmospheric_window_optics:
    type: gridded_analysis
    source: atmospheric_window_band_files
    groupby: all
    roles: *longwave_roles
    fields: *longwave_fields
    output_group: era5_modis_aod_nudging_band_optics
  carbon_dioxide_optics:
    type: gridded_analysis
    source: carbon_dioxide_band_files
    groupby: all
    roles: *longwave_roles
    fields: *longwave_fields
    output_group: era5_modis_aod_nudging_band_optics


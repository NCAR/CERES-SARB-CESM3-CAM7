  dust_and_continental_aod:
    type: timeseries
    sources:
      - {source: north_africa, variable: aod}
      - {source: middle_east, variable: aod}
      - {source: india, variable: aod}
      - {source: east_asia, variable: aod}
    title: "Dust and Continental Aerosol Regions: Visible AOD"
    output_subdir: plots/comparisons
    formats: [pdf]
  biomass_burning_aod:
    type: timeseries
    sources:
      - {source: southern_africa, variable: aod}
      - {source: south_america, variable: aod}
      - {source: canada, variable: aod}

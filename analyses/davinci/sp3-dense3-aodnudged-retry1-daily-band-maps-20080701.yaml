    combine: nested
    concat_dim: time
    parallel: false
    variables:
      column_extinction_source: &column_extinction_source
        source_name: Extinction_Column_Optical_Depth
        units: "1"
        valid_min: 0.0
      layer_scattering_source: &layer_scattering_source
        source_name: Scattering_Layer_Optical_Depth
        units: "1"
        valid_min: 0.0
      layer_asymmetry_source: &layer_asymmetry_source
        source_name: Layer_Asymmetry_Parameter
        units: "1"
        valid_min: 0.0
        valid_max: 1.0
  sw05_band_optics_files:

      layer_asymmetry_source: *layer_asymmetry_source

analyses:
  sw01_band_optics:
    type: gridded_analysis
    source: sw01_band_optics_files
    groupby: all
    roles: &band_roles
      column_extinction: column_extinction_source
      layer_scattering: layer_scattering_source
      layer_asymmetry: layer_asymmetry_source
    fields:
      column_extinction:
        formula: 'mean(column_extinction, dim="time")'
        units: "1"
        long_name: Daily mean SW01 column aerosol optical depth
        display_name: SW01 Column AOD
        style_preset: geosit_aod
      column_mean_asymmetry:
        formula: &asymmetry_formula 'sum(mean(layer_asymmetry * layer_scattering, dim="time"), dim="z") / sum(mean(layer_scattering, dim="time"), dim="z")'
        units: "1"
        long_name: Daily mean SW01 scattering-weighted column asymmetry
        display_name: SW01 Column Mean Asymmetry
    output_group: sarb_band_optics
  sw05_band_optics:
    type: gridded_analysis
    source: sw05_band_optics_files

analysis:
  start_time: "2008-01-01T00:00:00"
  end_time: "2008-12-31T23:59:59"
  output_dir: /glade/work/fillmore/Data/CERES-SARB-CAM7/runs/era5-modis-aod-nudging-band-optics-2008-composites
  log_dir: /glade/work/fillmore/Data/CERES-SARB-CAM7/runs/era5-modis-aod-nudging-band-optics-2008-composites/logs
  domain: global
  style:
    theme: ncar
    context: publication

# These compact inputs are prepared from the twelve completed monthly DAVINCI
# products by scripts/prepare_2008_optics_composites.py. Seasonal and annual
# means are calendar-day weighted. DJF combines January, February, and December
# 2008 for this within-calendar-year summary. SSA is extinction-weighted and
# asymmetry is scattering-weighted rather than averaged directly.
sources:
  ultraviolet_optics:
    type: generic
    display_name: 2008 ERA5- and MODIS-Nudged CAM7 Ultraviolet Aerosol Optics
    files: /glade/work/fillmore/Data/CERES-SARB-CAM7/runs/era5-modis-aod-nudging-band-optics-2008-composites/products/ultraviolet_optics/analysis.nc
    variables: &shortwave_product_variables
      column_aod:
        source_name: column_aod
        units: "1"
        display_name: Column Aerosol Optical Depth
        style_preset: geosit_aod
      single_scatter_albedo:
        source_name: single_scatter_albedo
        units: "1"
        display_name: Single-Scatter Albedo
      asymmetry:
        source_name: asymmetry
        units: "1"
        display_name: Asymmetry Parameter
  visible_optics:
    type: generic
    display_name: 2008 ERA5- and MODIS-Nudged CAM7 Visible Aerosol Optics
    files: /glade/work/fillmore/Data/CERES-SARB-CAM7/runs/era5-modis-aod-nudging-band-optics-2008-composites/products/visible_optics/analysis.nc
    variables: *shortwave_product_variables
  near_infrared_optics:
    type: generic
    display_name: 2008 ERA5- and MODIS-Nudged CAM7 Near-Infrared Aerosol Optics
    files: /glade/work/fillmore/Data/CERES-SARB-CAM7/runs/era5-modis-aod-nudging-band-optics-2008-composites/products/near_infrared_optics/analysis.nc
    variables: *shortwave_product_variables
  shortwave_infrared_optics:
    type: generic
    display_name: 2008 ERA5- and MODIS-Nudged CAM7 Shortwave-Infrared Aerosol Optics
    files: /glade/work/fillmore/Data/CERES-SARB-CAM7/runs/era5-modis-aod-nudging-band-optics-2008-composites/products/shortwave_infrared_optics/analysis.nc
    variables: *shortwave_product_variables
  water_vapor_optics:
    type: generic
    display_name: 2008 ERA5- and MODIS-Nudged CAM7 Water Vapor Band Aerosol Optics
    files: /glade/work/fillmore/Data/CERES-SARB-CAM7/runs/era5-modis-aod-nudging-band-optics-2008-composites/products/water_vapor_optics/analysis.nc
    variables: &longwave_product_variables
      column_scattering:
        source_name: column_scattering
        units: "1"
        display_name: Column Scattering Optical Depth
      column_extinction:
        source_name: column_extinction
        units: "1"
        display_name: Column Extinction Optical Depth
        style_preset: geosit_aod
      asymmetry:
        source_name: asymmetry
        units: "1"
        display_name: Asymmetry Parameter
  ozone_optics:
    type: generic
    display_name: 2008 ERA5- and MODIS-Nudged CAM7 Ozone Band Aerosol Optics
    files: /glade/work/fillmore/Data/CERES-SARB-CAM7/runs/era5-modis-aod-nudging-band-optics-2008-composites/products/ozone_optics/analysis.nc
    variables: *longwave_product_variables
  atmospheric_window_optics:
    type: generic
    display_name: 2008 ERA5- and MODIS-Nudged CAM7 Atmospheric Window Aerosol Optics
    files: /glade/work/fillmore/Data/CERES-SARB-CAM7/runs/era5-modis-aod-nudging-band-optics-2008-composites/products/atmospheric_window_optics/analysis.nc
    variables: *longwave_product_variables
  carbon_dioxide_optics:
    type: generic
    display_name: 2008 ERA5- and MODIS-Nudged CAM7 Carbon Dioxide Band Aerosol Optics
    files: /glade/work/fillmore/Data/CERES-SARB-CAM7/runs/era5-modis-aod-nudging-band-optics-2008-composites/products/carbon_dioxide_optics/analysis.nc
    variables: *longwave_product_variables


schema_version: 1

sources:
  gdex_root: /gdex/data/d633006
  invariant_geopotential: /gdex/data/d633006/e5.oper.invariant/e5.oper.invariant.128_129_z.regn320sc.2016010100_2016010100.nc

target:
  # This neighboring canonical file supplies the exact CAM f09/L32 static
  # coordinates, hybrid coefficients, PHIS, variable layout, and encoding.
  template_file: /glade/campaign/cgd/amp/wchapman/Nudging_ERA5/fv_L32_ncl/ERA5_fv09.cam2.i.2008-03-08-82800.nc
  expected_dimensions:
    lat: 192
    lon: 288
    lev: 32
    ilev: 33

period:
  start: '2008-03-09T00:00:00'
  end: '2008-03-10T23:00:00'
  # The neighboring canonical files from this weekly batch use March 8 as
  # their CAM base date. date/datesec still carry each exact UTC hour.
  reference_date: '2008-03-08T00:00:00'

processing:
  horizontal_interpolation: bilinear
  scalar_poles: zonal_mean
  vector_poles: zonal_wave_one
  surface_pressure_adjustment: ecmwf_makeic
  temperature_vertical_interpolation: quadratic_log_pressure_opt1
  humidity_vertical_interpolation: linear_pressure_opt1
  wind_vertical_interpolation: linear_log_pressure_opt2
  humidity_adjustment: clip_relative_humidity_0_1_before_and_after_vertical_interpolation
  # Compatibility with the existing 2008 canonical forcing at its pole rows.
  era5_geopotential_poles: legacy_zero
  staggered_v_poles: legacy_esmf_degenerate
  level_chunk_size: 16

output:
  directory: /glade/work/fillmore/Data/CERES-SARB-CAM7/ERA5_fv09_L32_20080309_20080310_v1
  format: NETCDF3_CLASSIC
  filename_template: 'ERA5_fv09.cam2.i.{date}-{seconds:05d}.nc'
